# Recording rules: values the dashboards and the SLO alerts use over and over, computed once per evaluation.
# Naming follows the Prometheus convention  level:metric:operations.
groups:
  - name: javaschoollab-http-recording
    interval: 15s
    rules:
      # Requests per second and 5xx per second, real traffic only (the actuator is not observed, see ObservabilityConfig).
      - record: jsl:http_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[5m]))
      - record: jsl:http_requests_5xx:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="javaschoollab", status=~"5.."}[5m])) or vector(0)
      # Share of requests that failed with a server error, over several windows (the multi-window SLO alerts below need all of them).
      - record: jsl:http_error_ratio:rate5m
        expr: (sum(rate(http_server_requests_seconds_count{application="javaschoollab", status=~"5.."}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[5m]))
      - record: jsl:http_error_ratio:rate30m
        expr: (sum(rate(http_server_requests_seconds_count{application="javaschoollab", status=~"5.."}[30m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[30m]))
      - record: jsl:http_error_ratio:rate1h
        expr: (sum(rate(http_server_requests_seconds_count{application="javaschoollab", status=~"5.."}[1h])) or vector(0)) / sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[1h]))
      - record: jsl:http_error_ratio:rate6h
        expr: (sum(rate(http_server_requests_seconds_count{application="javaschoollab", status=~"5.."}[6h])) or vector(0)) / sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[6h]))
      # Latency percentiles over 5 minutes.
      - record: jsl:http_request_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{application="javaschoollab"}[5m])))
      - record: jsl:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="javaschoollab"}[5m])))
      - record: jsl:http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application="javaschoollab"}[5m])))
      # Share of requests answered within 300 ms (the "fast enough" objective).
      - record: jsl:http_fast_ratio:rate5m
        expr: sum(rate(http_server_requests_seconds_bucket{application="javaschoollab", le="0.3"}[5m])) / sum(rate(http_server_requests_seconds_count{application="javaschoollab"}[5m]))
