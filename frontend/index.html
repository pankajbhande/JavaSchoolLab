<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#7c2d12" media="(prefers-color-scheme: dark)" />

    <!-- Generated from src/assets/logo1.jpg via npm run gen:favicon. favicon.ico exists so
         browsers probing the well-known path get a file rather than a 404. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>JavaSchoolLab | Learn Java, Spring Boot, React and more</title>
    <meta
      name="description"
      content="Learn Java, Spring Boot, React and more across 31 courses and 3,588 topics, with worked examples, diagrams and interview questions. An official product of DHIPAN Software Technologies Private Limited."
    />

    <!-- Defaults for links shared before the app has booted and set per-topic tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JavaSchoolLab" />
    <meta property="og:title" content="JavaSchoolLab | Learn Java, Spring Boot, React and more" />
    <meta
      property="og:description"
      content="31 courses, 3,588 topics, worked examples, diagrams and interview questions."
    />
    <meta property="og:url" content="https://javaschoollab.com/" />
    <meta property="og:image" content="https://javaschoollab.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JavaSchoolLab - learn Java, Spring Boot, React and more" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JavaSchoolLab | Learn Java, Spring Boot, React and more" />
    <meta
      name="twitter:description"
      content="31 courses, 3,588 topics, worked examples, diagrams and interview questions."
    />
    <meta name="twitter:image" content="https://javaschoollab.com/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <!-- First tab stop on every page: lets keyboard and screen-reader users jump the
         header, course strip and sidebar instead of tabbing through all of it. -->
    <a href="#main-content" class="jsl-skip-link">Skip to main content</a>

    <div id="root"></div>

    <noscript>
      JavaSchoolLab needs JavaScript to run. Please enable it, or view the course list at
      <a href="/sitemap.xml">/sitemap.xml</a>.
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
