# Loki: stores and searches the logs Alloy collects from the Docker containers. Single process, data on a local volume.
# No login: it is reachable only from the private "observability" network; Grafana is the way in.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h            # logs are kept 14 days
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_lookback: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true           # actually delete what is older than retention_period
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
