# JavaSchoolLab, Spring Boot edition: app (Spring Boot serving the site AND the API) -> db (MySQL)
#
# Spring serves the built React site, the API and the course content itself, so there is no nginx
# service here (put your own TLS proxy in front if you need HTTPS). Same .env variables as docker-compose.yml.
#
#   cd docker && docker compose -f docker-compose.spring.yml up -d --build
#   open http://localhost:8080
#
# The mysql-init scripts are deliberately NOT mounted: Spring runs Flyway migrations on startup
# (baseline-on-migrate), creating the tables on an empty volume and adopting an existing one without
# touching its data. Running 000_base_schema.sql first would only create tables outside Flyway's history.
# The db_data volume keeps users and progress across redeploys; do not run "down -v".
name: javaschoollab-spring

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-javaschoollab}
      MYSQL_USER: ${DB_USER:-jsl}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  app:
    build:
      context: ..
      dockerfile: server-spring/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_CONTENT_SOURCE: api
        SITE_URL: ${SITE_URL:-https://javaschoollab.com}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-javaschoollab}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-jsl}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Needed behind a proxy / load balancer so rate limits see real visitor addresses.
      FORWARD_HEADERS_STRATEGY: native
      # Email OTP delivery (Hostinger SMTP). Leave SMTP_HOST empty to disable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3001'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    ports:
      - "${WEB_PORT:-8080}:3001"
    networks: [backend]

volumes:
  db_data:

networks:
  backend:
