# Blackbox exporter: probes URLs from the outside, like a user would, and reports success and timing.
#   probe_success{instance="..."}          1 = answered with HTTP 2xx, 0 = failed
#   probe_duration_seconds                 total time of the probe
#   probe_http_duration_seconds{phase=...} time per phase: resolve, connect, tls, processing, transfer
#   probe_http_status_code
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: []        # empty = any 2xx
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
