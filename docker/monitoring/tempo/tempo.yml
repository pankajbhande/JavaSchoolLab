# Tempo: stores the distributed traces the application sends over OTLP, and turns them into metrics.
#   receives  OTLP over HTTP (4318) and gRPC (4317) from the application (network "javaschoollab_shared", name "javaschoollab-tempo")
#   keeps     traces 14 days on a local volume
#   derives   service-graph and span metrics (RED metrics per operation) and writes them to Prometheus, so Grafana can draw the service map
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      stack: javaschoollab
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://javaschoollab-prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
