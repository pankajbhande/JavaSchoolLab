# Runs on every push and pull request: backend tests, frontend checks, and a check that the Docker files still build and validate.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21, in-memory H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Audit production dependencies (fails on high severity)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (compose files valid, image builds, image scan)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the three compose files with the example settings
        working-directory: docker
        env:   # docker/.env is not in Git (it holds the passwords); any non-empty value satisfies the "required" checks
          DB_PASSWORD: ci
          DB_ROOT_PASSWORD: ci
          EXPORTER_PASSWORD: ci
          GRAFANA_ADMIN_PASSWORD: ci
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          REDIS_PASSWORD: ci
        run: |
          docker compose -f docker-compose.shared.yml config -q
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.monitoring.yml config -q
      - name: Build the application image
        run: docker build -f docker/Dockerfile -t javaschoollab/app:ci .
      - name: Scan the image for known vulnerabilities (fails on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: javaschoollab/app:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
